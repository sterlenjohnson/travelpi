# TravelPi radvd rollback artifact, a TEMPLATE: make deploy renders it with
# travelpi-ula-init into /etc/radvd.conf (@ULA_PREFIX@ = the per-install ULA
# /64 from /etc/travelpi/ula-prefix). radvd stays disabled (ADR 0006); room
# devices get a ULA SLAAC address plus the NAT64 route.
interface "wlan1" {
    AdvSendAdvert on;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;
    prefix @ULA_PREFIX@ {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr off;
    };
    route 64:ff9b::/96 {
    };
};
