# TravelPi load guard for rootful podman containers (machine.slice hosts every
# podman-run container's scope). Measured 2026-10-26: adguardhome 51.8M,
# containerd 12.6M on a 512 MB board. Cap the container fleet so routers
# (hostapd/dnsmasq/unbound) keep headroom; CPUQuota keeps radios responsive.
[Slice]
MemoryMax=256M
TasksMax=512
CPUQuota=200%
