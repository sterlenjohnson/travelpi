# The USB Wi-Fi 6E stick reports USB ID 0e8d:7961, which the MT7921AU
# driver (mt7921u) also claims. mt7921u binds the shared ID first and
# exposes only 2.4/5 GHz; the 6 GHz band exists only under the MT7925
# driver (mt7925u), but only on kernels whose mt7925u alias table covers the
# device ID; travelpi-radio-driver checks this and removes this file when it
# does not. Blacklisting mt7921u lets udev bind the shared ID to mt7925u at
# every boot. This applies only to that MT7921/MT7925 USB ID; other adapters
# need no blacklist.
# Installed to /etc/modprobe.d/travelpi-mt7925.conf by make deploy.
blacklist mt7921u
blacklist mt7921_common
