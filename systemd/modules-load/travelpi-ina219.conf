# I2C + INA219 (hwmon ina2xx driver, kernel 6.12.75+rpt-rpi-v8 verified present
# 2026-10-26) for 5V-rail current sensing. Requires dtparam=i2c_arm=on in
# /boot/firmware/config.txt (human step, boot file) and device registration:
#   echo ina219 0x44 > /sys/bus/i2c/devices/i2c-1/new_device
# The cockpit displays current automatically when hwmon reports ina219/ina226.
i2c-dev
i2c-bcm2835
ina2xx
