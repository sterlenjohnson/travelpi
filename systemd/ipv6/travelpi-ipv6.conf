# TravelPi IPv6 forwarding for the LAN (installed by make deploy). Room
# devices receive ULA addresses from systemd-networkd router advertisements;
# the Pi forwards between wlan1 and its uplinks/VPN interfaces. accept_ra is off on the AP interface so
# hotel/router RAs never hijack the AP side.
net.ipv6.conf.all.forwarding=1
net.ipv6.conf.default.forwarding=1
net.ipv6.conf.wlan1.forwarding=1
net.ipv6.conf.wlan1.accept_ra=0
# Optional: only exists when a Tailscale interface is present (leading - = ignore errors).
-net.ipv6.conf.tailscale0.accept_ra=0
net.ipv6.conf.eth0.accept_ra=1
